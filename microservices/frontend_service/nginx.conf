# SPA server block for the frontend container. try_files falls back to index.html so client-side
# (HTML5 history) routes like /loans deep-link correctly instead of 404ing.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
