services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/apache/kafka/data

  ledger-service-db:
    image: postgres:15
    container_name: ledger-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LEDGER_SERVICE_POSTGRES_DB}
      POSTGRES_USER: ${LEDGER_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LEDGER_SERVICE_POSTGRES_PASSWORD}
    ports:
      - "5001:5432"
    volumes:
      - ./ledger_service/db_scripts:/docker-entrypoint-initdb.d
      - ledger_data:/var/lib/postgresql/data

  ledger-service-app:
    build:
      context: ./ledger_service
      dockerfile: dockerfile
    image: ledger-service-app/clojure:latest
    container_name: ledger-service-app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=ledger-service-db
      - DB_PORT=5432
      - DB_NAME=${LEDGER_SERVICE_POSTGRES_DB}
      - DB_USER=${LEDGER_SERVICE_POSTGRES_USER}
      - DB_PASSWORD=${LEDGER_SERVICE_POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - ledger-service-db
      - kafka

  exchange-service-db:
    image: postgres:15
    container_name: exchange-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EXCHANGE_SERVICE_POSTGRES_DB}
      POSTGRES_USER: ${EXCHANGE_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EXCHANGE_SERVICE_POSTGRES_PASSWORD}
    ports:
      - "5002:5432"
    volumes:
      - ./exchange_service/db_scripts:/docker-entrypoint-initdb.d
      - exchange_data:/var/lib/postgresql/data

  exchange-service-app:
    build:
      context: ./exchange_service
      dockerfile: dockerfile
    image: exchange-service-app/clojure:latest
    container_name: exchange-service-app
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=exchange-service-db
      - DB_PORT=5432
      - DB_NAME=${EXCHANGE_SERVICE_POSTGRES_DB}
      - DB_USER=${EXCHANGE_SERVICE_POSTGRES_USER}
      - DB_PASSWORD=${EXCHANGE_SERVICE_POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - exchange-service-db
      - kafka

  # ClojureScript SPA. Reached only through the reverse proxy (no host port), so it stays same-origin with the API and needs no
  # CORS handling.
  frontend-app:
    build:
      context: ./frontend_service
      dockerfile: dockerfile
    image: frontend-service-app:latest
    container_name: frontend-app

  reverse-proxy:
    build:
      context: ./reverse_proxy
      dockerfile: dockerfile
    image: nginx:latest
    container_name: reverse-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ledger-service-app
      - exchange-service-app
      - frontend-app

  # --- Observability (Tier 1) -------------------------------------------------------------------------------------------------
  # Live log viewer across all containers. Reads the Docker socket (read-only).
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Kafka topics, messages and consumer-group lag. Talks to the broker over the internal network (kafka:9092), so the
  # advertised-listener limitation doesn't apply.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # Web DB browser for both Postgres instances (accounts, transactions, loans, processed_events, outbox). Pick the server at
  # the login screen.
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ledger-service-db
    depends_on:
      - ledger-service-db
      - exchange-service-db

volumes:
  kafka_data:
  ledger_data:
  exchange_data:
